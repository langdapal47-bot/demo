<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Form Example</title>
</head>
<body>
    <h2>Secure Form with 5 Fields</h2>

    <form action="new.php" method="POST" autocomplete="off">
        <label>Full Name:</label><br>
        <input type="text" name="name" required minlength="3"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Phone:</label><br>
        <input type="tel" name="phone" pattern="[0-9+\-\s]{7,15}" required><br><br>

        <label>Age:</label><br>
        <input type="number" name="age" min="1" max="120" required><br><br>

        <label>Message:</label><br>
        <textarea name="message" required minlength="5"></textarea><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
